[project]
name = "refereekit"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["PyMuPDF>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
refereekit = "refereekit.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
