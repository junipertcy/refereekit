[project]
name = "refereekit"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["PyMuPDF>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8"]
llm = ["anthropic>=0.40"]

[project.scripts]
refereekit = "refereekit.cli:main"

# Only the refereekit package is installable; top-level style/ and diagrams/
# are repo assets, not importable packages. Without this, setuptools flat-layout
# auto-discovery errors on "Multiple top-level packages discovered".
[tool.setuptools.packages.find]
include = ["refereekit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
